<!DOCTYPE html>
<html>
<head>
	<title>Flair Node</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 1920px;
			height: 1080px;
			background: black;
			overflow: hidden;
			font-family: sans-serif;
		}

		#bootScreen, #errorScreen {
			position: absolute;
			top: 0; left: 0;
			width: 100%; height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: black;
			z-index: 1000;
		}

		#bootScreen img, #errorScreen img {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}
	</style>
</head>
<body>
	<!-- Boot splash -->
	<div id="bootScreen" style="display: none;">
		<img src="./Flair_Boot_128x128.png" alt="Flair Boot">
	</div>

	<!-- Error fallback -->
	<div id="errorScreen" style="display: none;">
		<img src="./Flair_Error_128x128.png" alt="Error">
	</div>

	<!-- Identify this node -->
	<div id="identifyThisNodeScreen" style="display: none; background-color: green; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- Identify not this node -->
	<div id="identifyNotThisNodeScreen" style="display: none; background-color: red; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- serial number -->
	<div id="serialNumberScreen" style="display: none; background-color: black; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- wall type zones layout -->
	<div id="wallTypeZonesLayout" style="position: relative; width: 100%; height: 100%;"></div>

	<!-- rendered videos layout -->
	<div id="renderedVideosLayout" style="position: relative; width: 100%; height: 100%;"></div>

	<!-- offline indicator -->
	<img id="offline-indicator" src="./Assets/offline-indicator.png" style="display: none; position: absolute; top: 0; left: 0; width: 32px; height: 32px; z-index: 99999;">


	<script>
		console.log(`---------------------------
Flair Node HTML Render Page
Copyright 2025 Drew Shipps, J Squared Systems
System initializing...
---------------------------`);


		// === VARIABLES ===
		const WS_PORT = 9223;
		let ws = null;
		let reconnectInterval = 1000;
		let isConnected = false;


		// DOM elements
		const bootScreen = document.getElementById('bootScreen');
		const errorScreen = document.getElementById('errorScreen');
		const offlineIndicator = document.getElementById('offline-indicator');


		// === Boot sequence (1 s per color, fully crash-safe) ===
		function startBootSequence() {
			const colors = ['red', 'green', 'blue', 'black'];

			colors.forEach((color, idx) => {
				setTimeout(() => {
					try {
						document.body.style.backgroundColor = color;
						console.log('Flair boot color test ' + color);
					} catch (err) {
						console.error('Boot sequence error:', err);
						showErrorScreen();
					}
				}, idx * 1000); // 1000 ms per color
			});
		}

		// start boot pattern immediately
		startBootSequence();

		// show boot screen after 4 sec
		setTimeout(showBootScreen, 4000);


		// === WebSocket Setup ===
		function connectWebSocket() {
			try {
				ws = new WebSocket(`ws://localhost:9223`);

				ws.onopen = () => {
					console.log('WebSocket connected!');
					isConnected = true;
					hideErrorScreen(); // if you have one
					hideBootScreen();
				};

				ws.onmessage = (event) => {
					try {
						const msg = JSON.parse(event.data);
						handleWebSocketMessage(msg); // your command handler
					} catch (err) {
						console.error('WS message error:', err);
						showErrorScreen();
					}
				};

				ws.onerror = (err) => {
					console.error('WebSocket error:', err);
				};

				ws.onclose = () => {
					console.warn('WebSocket disconnected');
					isConnected = false;
					showErrorScreen();
					hideAllRenderedVideoFiles();
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();

					// attempt reconnect after delay
					setTimeout(() => {
						connectWebSocket();
					}, reconnectInterval);
				};

			} catch (err) {
				console.error('WebSocket connection error:', err);

				// retry after delay if constructor failed
				setTimeout(() => {
					connectWebSocket();
				}, reconnectInterval);
			}
		}

		// connect web socket after 14 sec (4 sec RGB test 10 sec boot screen)
		setTimeout(connectWebSocket, 14000);


		// === Global crash guard ===
		window.addEventListener('error', (e) => {
			console.error('Unhandled error:', e.error || e.message);
			showErrorScreen();
			hideAllRenderedVideoFiles();
			hideIdentifyScreen();
			hideSerialNumberScreen();
			hideWallTypesLayout();
		});

		window.addEventListener('unhandledrejection', (e) => {
			console.error('Unhandled promise rejection:', e.reason);
			showErrorScreen();
			hideAllRenderedVideoFiles();
			hideIdentifyScreen();
			hideSerialNumberScreen();
			hideWallTypesLayout();
		});


		// handle the raw websocket message and attempt to parse into commands
		function handleWebSocketMessage(msg) {
			try {
				// validate message format
				if (!msg || typeof msg !== 'object') {
					console.warn('Invalid WebSocket message format');
					return;
				}

				const { command, data } = msg;

				if (!command) {
					console.warn('WebSocket message missing "command" field');
					return;
				}

				handleCommand(command, data);
			} catch (err) {
				console.error('Failed to process WebSocket message:', err);
				showErrorScreen();
				hideAllRenderedVideoFiles();
				hideIdentifyScreen();
				hideSerialNumberScreen();
				hideWallTypesLayout();
			}
		}



		// handle websocket commands
		function handleCommand(command, data) {
			// On first valid command, hide boot screen
			bootScreen.style.display = 'none';

			switch (command) {
				case 'reload_page':
					console.warn('Reloading page via remote command...');
					location.reload();
					break;

				case 'identify_this_node':
					hideWallTypesLayout();
					hideSerialNumberScreen();
					showIdentifyScreen(true, data?.serial_number);
					hideAllRenderedVideoFiles();
					break;

				case 'identify_not_this_node':
					hideWallTypesLayout();
					hideSerialNumberScreen();
					showIdentifyScreen(false, data?.serial_number);
					hideAllRenderedVideoFiles();
					break;

				case 'show_serial_number':
					hideIdentifyScreen();
					hideWallTypesLayout();
					showSerialNumberScreen(data?.serial_number);
					hideAllRenderedVideoFiles();
					break;

				case 'disable_identify_mode':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();
					hideAllRenderedVideoFiles();
					break;

				case 'show_wall_type_zones_layout':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					showWallTypeZonesLayout(data);
					hideAllRenderedVideoFiles();
					break;

				case 'show_wall_type_zones_layout_with_time':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					showWallTypeZonesLayoutWithTime(data);
					hideAllRenderedVideoFiles();
					break;

				case 'render_video_file':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();
					renderVideoFile(data);
					break;

				case 'hide_rendered_video_files':
					hideAllRenderedVideoFiles();
					break;

				case 'assert_video_is_playing':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();
					assertVideoIsPlaying(data);
					break;

				case 'clear_videos_except_dom_ids':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();
					clearVideosExceptDomIds(data);
					break;

				case 'clear_video':
					clearVideoById(data);
					break;

				case 'show_offline_indicator':
					showOfflineIndicator();
					break;

				case 'hide_offline_indicator':
					hideOfflineIndicator();
					break;


				default:
					console.warn(`Unknown command: ${command}`);
			}
		}


		// MAIN APP FUNCTIONS HERE

		function showIdentifyScreen(isThisNode, serialNumber = 'UNKNOWN') {
			const yesDiv = document.getElementById('identifyThisNodeScreen');
			const noDiv = document.getElementById('identifyNotThisNodeScreen');

			const targetDiv = isThisNode ? yesDiv : noDiv;
			const otherDiv = isThisNode ? noDiv : yesDiv;

			// hide the other
			otherDiv.style.display = 'none';

			// set up targetDiv as a grid
			targetDiv.style.display = 'grid';
			targetDiv.style.gridTemplateColumns = 'repeat(auto-fill, minmax(180px, 1fr))';
			targetDiv.style.gridAutoRows = '60px'; // fixed row height
			targetDiv.style.gap = '0px';
			targetDiv.style.padding = '5px';
			targetDiv.style.color = 'white';
			targetDiv.style.fontSize = '16px';
			targetDiv.style.fontFamily = 'monospace';
			targetDiv.style.overflow = 'hidden';
			targetDiv.style.height = '100vh'; // full screen height

			// define text for each block
			const text = isThisNode
				? `Hi, it's me!<br>(SN: ${serialNumber})`
				: `Sorry, not me.<br>(SN: ${serialNumber})`;

			// generate grid cells
			const totalBlocks = 170;
			let gridHtml = '';

			for (let i = 0; i < totalBlocks; i++) {
				gridHtml += `
					<div style="
						background: none;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						text-align: center;
						width: 180px;
						height: 60px;
					">
						${text}
					</div>
				`;
			}

			// inject grid into target
			targetDiv.innerHTML = gridHtml;
		}

		function hideIdentifyScreen() {
			const yesDiv = document.getElementById('identifyThisNodeScreen');
			const noDiv = document.getElementById('identifyNotThisNodeScreen');

			yesDiv.style.display = 'none';
			noDiv.style.display = 'none';
		}



		function showSerialNumberScreen(serialNumber = 'UNKNOWN') {
			const targetDiv = document.getElementById('serialNumberScreen');

			// set up targetDiv as a grid
			targetDiv.style.display = 'grid';
			targetDiv.style.gridTemplateColumns = 'repeat(auto-fill, minmax(180px, 1fr))';
			targetDiv.style.gridAutoRows = '60px'; // fixed row height
			targetDiv.style.gap = '0px';
			targetDiv.style.padding = '5px';
			targetDiv.style.color = 'white';
			targetDiv.style.fontSize = '16px';
			targetDiv.style.fontFamily = 'monospace';
			targetDiv.style.overflow = 'hidden';
			targetDiv.style.height = '100vh'; // full screen height

			// define text for each block
			const text = `${serialNumber}`;

			// generate grid cells
			const totalBlocks = 170;
			let gridHtml = '';

			for (let i = 0; i < totalBlocks; i++) {
				gridHtml += `
					<div style="
						background: none;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						text-align: center;
						width: 180px;
						height: 60px;
					">
						${text}
					</div>
				`;
			}

			// inject grid into target
			targetDiv.innerHTML = gridHtml;
		}

		function hideSerialNumberScreen() {
			const targetDiv = document.getElementById('serialNumberScreen');

			targetDiv.style.display = 'none';
		}







		function showWallTypeZonesLayout(data) {
			const container = document.getElementById('wallTypeZonesLayout');

			// Clear existing content
			container.style.display = 'block';
			container.innerHTML = '';

			// Loop through each zone
			data.zones.forEach(zone => {
				const zoneDiv = document.createElement('div');
				zoneDiv.style.position = 'absolute';
				zoneDiv.style.left = `${zone.x}px`;
				zoneDiv.style.top = `${zone.y}px`;
				zoneDiv.style.width = `${zone.width}px`;
				zoneDiv.style.height = `${zone.height}px`;
				zoneDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
				zoneDiv.style.border = '1px solid rgba(255, 255, 255, 0.3)';
				zoneDiv.style.color = 'white';
				zoneDiv.style.padding = '2px';
				zoneDiv.style.fontSize = '14px';
				zoneDiv.style.fontWeight = '500';
				zoneDiv.style.boxSizing = 'border-box';

				const innerDiv = document.createElement('div');
				innerDiv.style.width = '100%';
				innerDiv.style.height = '100%';
				innerDiv.style.display = 'flex';
				innerDiv.style.flexDirection = 'column';
				innerDiv.style.justifyContent = 'center';
				innerDiv.style.alignItems = 'center';
				innerDiv.style.textAlign = 'center';
				innerDiv.style.lineHeight = '1.2';
				innerDiv.style.padding = '0px';
				innerDiv.style.wordBreak = 'break-word';

				// Calculate responsive font size
				const fontSize = Math.min(Math.min(zone.width, zone.height) * 0.15, 30);
				innerDiv.style.fontSize = `${fontSize}px`;

				// Set inner text
				innerDiv.innerHTML = `
					<div>${zone.name}</div>
					<div>(${zone.x}, ${zone.y})</div>
					<div>${zone.width}x${zone.height}px</div>
				`;

				// Append inner to outer
				zoneDiv.appendChild(innerDiv);
				container.appendChild(zoneDiv);
			});
		}

		function hideWallTypesLayout() {
			const container = document.getElementById('wallTypeZonesLayout');
			container.style.display = 'none';
		}





		function showWallTypeZonesLayoutWithTime(data) {
			const container = document.getElementById('wallTypeZonesLayout');

			// Clear existing content
			container.style.display = 'block';
			container.innerHTML = '';

			// Loop through each zone
			data.zones.forEach(zone => {
				const zoneDiv = document.createElement('div');
				zoneDiv.style.position = 'absolute';
				zoneDiv.style.left = `${zone.x}px`;
				zoneDiv.style.top = `${zone.y}px`;
				zoneDiv.style.width = `${zone.width}px`;
				zoneDiv.style.height = `${zone.height}px`;
				zoneDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
				zoneDiv.style.border = '1px solid rgba(255, 255, 255, 0.3)';
				zoneDiv.style.color = 'white';
				zoneDiv.style.padding = '2px';
				zoneDiv.style.fontSize = '14px';
				zoneDiv.style.fontWeight = '500';
				zoneDiv.style.boxSizing = 'border-box';

				const innerDiv = document.createElement('div');
				innerDiv.style.width = '100%';
				innerDiv.style.height = '100%';
				innerDiv.style.display = 'flex';
				innerDiv.style.flexDirection = 'column';
				innerDiv.style.justifyContent = 'center';
				innerDiv.style.alignItems = 'center';
				innerDiv.style.textAlign = 'center';
				innerDiv.style.lineHeight = '1.2';
				innerDiv.style.padding = '0px';
				innerDiv.style.wordBreak = 'break-word';

				// Calculate responsive font size
				const fontSize = Math.min(Math.min(zone.width, zone.height) * 0.15, 30);
				innerDiv.style.fontSize = `${fontSize}px`;

				// Set inner text
				innerDiv.innerHTML = `
					<div>${zone.name}</div>
					<div>(${zone.x}, ${zone.y})</div>
					<div>${zone.width}x${zone.height}px</div>
					<div>NodeJS Uptime: ${zone.uptime}</div>
					<div>Current Time: ${zone.time_of_day}</div>
				`;

				// Append inner to outer
				zoneDiv.appendChild(innerDiv);
				container.appendChild(zoneDiv);
			});
		}









		// ==== RENDER VIDEO FILES ======
		function hideAllRenderedVideoFiles() {
			const container = document.getElementById('renderedVideosLayout');
			container.innerHTML = '';
		}


		function renderVideoFile(data) {
			const layout = document.getElementById('renderedVideosLayout');

			// Construct full file path by replacing "render.html" in current location
			const basePath = window.location.href.replace(/render\.html$/, '');
			const fullPath = basePath + data.file.replace(/^\//, '');

			console.log('rendering at ' + fullPath)

			let element;

			if (data.type === 'video') {
				element = document.createElement('video');
				element.src = fullPath;
				element.autoplay = true;
				element.muted = true;
				element.playsInline = true;

				const shouldLoop = data.loop !== false;
				element.loop = shouldLoop;

				if (!shouldLoop) {
					element.addEventListener('ended', () => {
						element.remove();
					});
				}

			} else if (data.type === 'image') {
				element = document.createElement('img');
				element.src = fullPath;
			} else {
				console.warn('Unknown type:', data.type);
				return;
			}

			element.id = data.dom_id;
			element.style.position = 'absolute';
			element.style.left = data.x + 'px';
			element.style.top = data.y + 'px';
			element.style.width = data.width + 'px';
			element.style.height = data.height + 'px';
			element.style.objectFit = 'cover';
			const logicalZ = (typeof data.z_index === 'number') ? data.z_index : 17;
			element.style.zIndex = 100 - logicalZ;

			layout.appendChild(element);
		}

		function assertVideoIsPlaying(data) {
			const existing = document.getElementById(data.dom_id);

			if (existing) {
				// Handle VIDEO check
				if (existing.tagName === 'VIDEO') {
					const isValid =
						existing.readyState >= 2 &&
						!existing.paused &&
						!existing.ended;

					if (isValid) {
						return; // No action needed
					}
				}

				// Handle IMAGE check
				else if (existing.tagName === 'IMG') {
					const isValid =
						existing.complete &&
						existing.naturalWidth > 0 &&
						existing.naturalHeight > 0;

					if (isValid) {
						return; // No action needed
					}
				}

				// Element is invalid, remove it and fall through to render a new one
				existing.remove();
			}

			// if no valid element found, re-render this element
			if (!existing) { renderVideoFile(data); }
		}

		function clearVideosExceptDomIds(data) {
			try {
				const domIdsToKeep = Array.isArray(data?.dom_ids) ? data.dom_ids.map(String) : [];

				const all = document.querySelectorAll('video, img');
				all.forEach((el) => {
					if (!domIdsToKeep.includes(el.id)) {
						el.remove();
					}
				});
			} catch (err) {
				console.error('clearVideosExceptDomIds failed:', err);
			}
		}


		function clearVideoById(data) {
			try {
				const el = document.getElementById(data?.dom_id);
				if (el) el.remove();
			} catch (err) {
				console.error('clearVideoById failed:', err);
			}
		}
















		// === Offline Indicator ===
		function showOfflineIndicator() {
			offlineIndicator.style.display = 'block';
		}

		function hideOfflineIndicator() {
			offlineIndicator.style.display = 'none';
		}


		// === Fallback/Error Handling ===
		function showBootScreen() {
			console.log('Showing Flair boot screen...');
			bootScreen.style.display = 'flex';
		}

		function hideBootScreen() {
			bootScreen.style.display = 'none';
		}

		function showErrorScreen() {
			errorScreen.style.display = 'flex';
		}

		function hideErrorScreen() {
			errorScreen.style.display = 'none';
		}
	</script>
</body>
</html>
