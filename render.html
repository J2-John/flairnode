<!DOCTYPE html>
<html>
<head>
	<title>Flair Node</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 1920px;
			height: 1080px;
			background: black;
			overflow: hidden;
			font-family: sans-serif;
			cursor: none;
		}

		#bootScreen, #errorScreen {
			position: absolute;
			top: 0; left: 0;
			width: 100%; height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: black;
			z-index: 1000;
		}

		#bootScreen img, #errorScreen img {
			width: 100%;
			height: 100%;
			object-fit: contain;
		}
	</style>
</head>
<body>
	<!-- Boot splash -->
	<div id="bootScreen" style="display: none;">
		<img src="./Flair_Boot_128x128.png" alt="Flair Boot">
	</div>

	<!-- Error fallback -->
	<div id="errorScreen" style="display: none;">
		<img src="./Flair_Error_128x128.png" alt="Error">
	</div>

	<!-- Identify this node -->
	<div id="identifyThisNodeScreen" style="display: none; background-color: green; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- Identify not this node -->
	<div id="identifyNotThisNodeScreen" style="display: none; background-color: red; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- serial number -->
	<div id="serialNumberScreen" style="display: none; background-color: black; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- commissioning screen - shown on first boot at the J2 facility, while the node brings itself to the current release -->
	<div id="commissioningScreen" style="display: none; background-color: black; width: 100%; height: 100%; position: absolute; overflow: hidden;"></div>

	<!-- wall type zones layout -->
	<div id="wallTypeZonesLayout" style="position: relative; width: 100%; height: 100%;"></div>

	<!-- rendered videos layout -->
	<div id="renderedVideosLayout" style="position: relative; width: 100%; height: 100%;"></div>

	<!-- offline indicator -->
	<img id="offline-indicator" src="./Assets/offline-indicator.png" style="display: none; position: absolute; top: 0; left: 0; width: 32px; height: 32px; z-index: 99999;">


	<script>
		console.log(`---------------------------
Flair Node HTML Render Page
Copyright 2025 Drew Shipps, J Squared Systems
System initializing...
---------------------------`);


		// === VARIABLES ===
		const WS_PORT = 9223;
		let ws = null;
		let reconnectInterval = 1000;
		let isConnected = false;


		// DOM elements
		const bootScreen = document.getElementById('bootScreen');
		const errorScreen = document.getElementById('errorScreen');
		const offlineIndicator = document.getElementById('offline-indicator');


		// === Boot sequence (1 s per color, fully crash-safe) ===
		function startBootSequence() {
			const colors = ['red', 'green', 'blue', 'black'];

			colors.forEach((color, idx) => {
				setTimeout(() => {
					try {
						document.body.style.backgroundColor = color;
						console.log('Flair boot color test ' + color);
					} catch (err) {
						console.error('Boot sequence error:', err);
						showErrorScreen();
					}
				}, idx * 1000); // 1000 ms per color
			});
		}

		// start boot pattern immediately
		startBootSequence();

		// show boot screen after 4 sec
		setTimeout(showBootScreen, 4000);


		// === WebSocket Setup ===
		function connectWebSocket() {
			try {
				ws = new WebSocket(`ws://localhost:9223`);

				ws.onopen = () => {
					console.log('WebSocket connected!');
					isConnected = true;
					hideErrorScreen(); // if you have one
					hideBootScreen();
				};

				ws.onmessage = (event) => {
					try {
						const msg = JSON.parse(event.data);
						handleWebSocketMessage(msg); // your command handler
					} catch (err) {
						console.error('WS message error:', err);
						showErrorScreen();
					}
				};

				ws.onerror = (err) => {
					console.error('WebSocket error:', err);
				};

				ws.onclose = () => {
					console.warn('WebSocket disconnected');
					isConnected = false;
					showErrorScreen();
					hideAllRenderedVideoFiles();
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();

					// attempt reconnect after delay
					setTimeout(() => {
						connectWebSocket();
					}, reconnectInterval);
				};

			} catch (err) {
				console.error('WebSocket connection error:', err);

				// retry after delay if constructor failed
				setTimeout(() => {
					connectWebSocket();
				}, reconnectInterval);
			}
		}

		// connect web socket after 14 sec (4 sec RGB test 10 sec boot screen)
		setTimeout(connectWebSocket, 14000);


		// === Global crash guard ===
		window.addEventListener('error', (e) => {
			console.error('Unhandled error:', e.error || e.message);
			showErrorScreen();
			hideAllRenderedVideoFiles();
			hideIdentifyScreen();
			hideSerialNumberScreen();
			hideWallTypesLayout();
		});

		window.addEventListener('unhandledrejection', (e) => {
			console.error('Unhandled promise rejection:', e.reason);
			showErrorScreen();
			hideAllRenderedVideoFiles();
			hideIdentifyScreen();
			hideSerialNumberScreen();
			hideWallTypesLayout();
		});


		// === Render health — OBSERVE ONLY (added 2026-09-21) ===
		//
		// The browser is the only thing that knows whether the wall is actually
		// changing. Everything FlairNode.js reports about itself is liveness: on
		// 2026-08-18 two Chromium instances fought over the render socket with the
		// error image on the glass, and overallStatus said "online" throughout.
		//
		// Every HEALTH_REPORT_INTERVAL_MS this page tells FlairNode.js three things,
		// because each catches a different lie:
		//
		//   page_frames   how many times the page painted. Stops if the browser
		//                 hangs or crashes.
		//   video_frames  how many video frames were actually presented. Stops
		//                 when a decoder freezes on a last-good frame while the
		//                 page keeps painting — the failure nothing else can see.
		//   screen        which layer is on top. A page painting the ERROR image
		//                 at 60fps is not healthy; a node with no wall showing its
		//                 serial number is.
		//
		// page_session changes on every page load, so after a restart a watcher can
		// tell a fresh report from one the previous build left behind.
		//
		// NOTHING ACTS ON THESE NUMBERS YET. Doctrine 2.9: an observer runs a full
		// cycle before any enforcer is allowed to trust it.
		//
		// THIS CODE MUST NEVER THROW. The page's global error handler above puts up
		// the error screen on ANY uncaught error, so a bug here would cause the very
		// failure it exists to detect. Every entry point is wrapped, and none of it
		// calls showErrorScreen().
		const HEALTH_REPORT_INTERVAL_MS = 5000;
		const pageSessionId = Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8);
		const pageLoadedAt = Date.now();

		let pageFramesSinceReport = 0;
		let videoFramesSinceReport = 0;
		let lastHealthReportAt = Date.now();

		// Counted per paint. requestAnimationFrame only fires when the browser is
		// actually producing frames, so a hung renderer stops it.
		function countPageFrame() {
			try {
				pageFramesSinceReport++;
				requestAnimationFrame(countPageFrame);
			} catch (err) {
				console.error('health: page frame counter stopped:', err);
			}
		}

		try {
			requestAnimationFrame(countPageFrame);
		} catch (err) {
			console.error('health: could not start page frame counter:', err);
		}

		// Counted per PRESENTED video frame, via requestVideoFrameCallback — not
		// timeupdate, which keeps firing on a video whose picture has frozen.
		// Called once for each <video> this page creates.
		function watchVideoFrames(video) {
			try {
				if (typeof video.requestVideoFrameCallback !== 'function') {
					return;
				}

				const onFrame = function () {
					try {
						videoFramesSinceReport++;

						// Stop re-arming once the element is gone, so a removed video
						// leaves no callback chain behind.
						if (video.isConnected) {
							video.requestVideoFrameCallback(onFrame);
						}
					} catch (err) {
						console.error('health: video frame counter stopped:', err);
					}
				};

				video.requestVideoFrameCallback(onFrame);
			} catch (err) {
				console.error('health: could not watch video frames:', err);
			}
		}

		function isShown(element) {
			return !!element && element.style.display !== 'none' && element.style.display !== '';
		}

		// Which layer the viewer is looking at, highest first. The error and boot
		// screens sit at z-index 1000 above everything, so they are checked first.
		function visibleScreen() {
			if (isShown(errorScreen)) return 'error';
			if (isShown(bootScreen)) return 'boot';
			if (isShown(document.getElementById('identifyThisNodeScreen'))) return 'identify';
			if (isShown(document.getElementById('identifyNotThisNodeScreen'))) return 'identify';
			if (isShown(document.getElementById('serialNumberScreen'))) return 'serial';

			const content = document.getElementById('renderedVideosLayout');
			if (content && content.children.length > 0) return 'content';

			// Hiding this layer sets display:none but can leave its children in
			// place, so children alone would report a layer nobody can see.
			const zones = document.getElementById('wallTypeZonesLayout');
			if (zones && zones.style.display !== 'none' && zones.children.length > 0) return 'zones';

			return 'blank';
		}

		function sendHealthReport() {
			try {
				const now = Date.now();
				const videos = document.querySelectorAll('#renderedVideosLayout video');

				let videosPlaying = 0;
				videos.forEach(function (v) {
					if (!v.error && !v.paused && !v.ended && v.readyState >= 2) {
						videosPlaying++;
					}
				});

				const report = {
					type: 'health',
					data: {
						page_session: pageSessionId,
						page_age_ms: now - pageLoadedAt,
						interval_ms: now - lastHealthReportAt,
						page_frames: pageFramesSinceReport,
						video_frames: videoFramesSinceReport,
						videos_mounted: videos.length,
						videos_playing: videosPlaying,
						images_mounted: document.querySelectorAll('#renderedVideosLayout img').length,
						screen: visibleScreen(),
					},
				};

				// Counters restart every interval, sent or not. A report is
				// "frames in the last interval_ms", never a running total, so a
				// dropped socket cannot make an old burst look like current life.
				pageFramesSinceReport = 0;
				videoFramesSinceReport = 0;
				lastHealthReportAt = now;

				if (ws && ws.readyState === WebSocket.OPEN) {
					ws.send(JSON.stringify(report));
				}
			} catch (err) {
				console.error('health: report failed:', err);
			}
		}

		setInterval(sendHealthReport, HEALTH_REPORT_INTERVAL_MS);


		// handle the raw websocket message and attempt to parse into commands
		function handleWebSocketMessage(msg) {
			try {
				// validate message format
				if (!msg || typeof msg !== 'object') {
					console.warn('Invalid WebSocket message format');
					return;
				}

				const { command, data } = msg;

				if (!command) {
					console.warn('WebSocket message missing "command" field');
					return;
				}

				handleCommand(command, data);
			} catch (err) {
				console.error('Failed to process WebSocket message:', err);
				showErrorScreen();
				hideAllRenderedVideoFiles();
				hideIdentifyScreen();
				hideSerialNumberScreen();
				hideWallTypesLayout();
			}
		}



		// handle websocket commands
		function handleCommand(command, data) {
			// On first valid command, hide boot screen
			bootScreen.style.display = 'none';

			switch (command) {
				case 'reload_page':
					console.warn('Reloading page via remote command...');
					location.reload();
					break;

				case 'identify_this_node':
					hideWallTypesLayout();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					showIdentifyScreen(true, data?.serial_number);
					hideAllRenderedVideoFiles();
					break;

				case 'identify_not_this_node':
					hideWallTypesLayout();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					showIdentifyScreen(false, data?.serial_number);
					hideAllRenderedVideoFiles();
					break;

				// show_serial_number is how commissioning ENDS: the server stops
				// sending the block, PlaybackController falls through to its
				// wall-type fallback, and this case takes the commissioning
				// screen down. That is why hideCommissioningScreen() here is not
				// housekeeping - it is the transition.
				case 'show_serial_number':
					hideIdentifyScreen();
					hideWallTypesLayout();
					hideCommissioningScreen();
					showSerialNumberScreen(data?.serial_number, data?.security_code);
					hideAllRenderedVideoFiles();
					break;

				case 'show_commissioning':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideWallTypesLayout();
					showCommissioningScreen(data?.state, data?.step, data?.version);
					hideAllRenderedVideoFiles();
					break;

				case 'disable_identify_mode':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					hideWallTypesLayout();
					hideAllRenderedVideoFiles();
					break;

				case 'show_wall_type_zones_layout':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					showWallTypeZonesLayout(data);
					hideAllRenderedVideoFiles();
					break;

				case 'show_wall_type_zones_layout_with_time':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					showWallTypeZonesLayoutWithTime(data);
					hideAllRenderedVideoFiles();
					break;

				case 'render_video_file':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					hideWallTypesLayout();
					renderVideoFile(data);
					break;

				case 'hide_rendered_video_files':
					hideAllRenderedVideoFiles();
					break;

				case 'assert_video_is_playing':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					hideWallTypesLayout();
					assertVideoIsPlaying(data);
					break;

				case 'clear_videos_except_dom_ids':
					hideIdentifyScreen();
					hideSerialNumberScreen();
					hideCommissioningScreen();
					hideWallTypesLayout();
					clearVideosExceptDomIds(data);
					break;

				case 'clear_video':
					clearVideoById(data);
					break;

				case 'show_offline_indicator':
					showOfflineIndicator();
					break;

				case 'hide_offline_indicator':
					hideOfflineIndicator();
					break;


				default:
					console.warn(`Unknown command: ${command}`);
			}
		}


		// MAIN APP FUNCTIONS HERE

		function showIdentifyScreen(isThisNode, serialNumber = 'UNKNOWN') {
			const yesDiv = document.getElementById('identifyThisNodeScreen');
			const noDiv = document.getElementById('identifyNotThisNodeScreen');

			const targetDiv = isThisNode ? yesDiv : noDiv;
			const otherDiv = isThisNode ? noDiv : yesDiv;

			// hide the other
			otherDiv.style.display = 'none';

			// set up targetDiv as a grid
			targetDiv.style.display = 'grid';
			targetDiv.style.gridTemplateColumns = 'repeat(auto-fill, minmax(180px, 1fr))';
			targetDiv.style.gridAutoRows = '60px'; // fixed row height
			targetDiv.style.gap = '0px';
			targetDiv.style.padding = '5px';
			targetDiv.style.color = 'white';
			targetDiv.style.fontSize = '16px';
			targetDiv.style.fontFamily = 'monospace';
			targetDiv.style.overflow = 'hidden';
			targetDiv.style.height = '100vh'; // full screen height

			// define text for each block
			const text = isThisNode
				? `Hi, it's me!<br>(SN: ${serialNumber})`
				: `Sorry, not me.<br>(SN: ${serialNumber})`;

			// generate grid cells
			const totalBlocks = 170;
			let gridHtml = '';

			for (let i = 0; i < totalBlocks; i++) {
				gridHtml += `
					<div style="
						background: none;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						text-align: center;
						width: 180px;
						height: 60px;
					">
						${text}
					</div>
				`;
			}

			// inject grid into target
			targetDiv.innerHTML = gridHtml;
		}

		function hideIdentifyScreen() {
			const yesDiv = document.getElementById('identifyThisNodeScreen');
			const noDiv = document.getElementById('identifyNotThisNodeScreen');

			yesDiv.style.display = 'none';
			noDiv.style.display = 'none';
		}



		function showSerialNumberScreen(serialNumber = 'UNKNOWN', securityCode = null) {
			const targetDiv = document.getElementById('serialNumberScreen');

			// set up targetDiv as a grid
			targetDiv.style.display = 'grid';
			targetDiv.style.gridTemplateColumns = 'repeat(auto-fill, minmax(180px, 1fr))';
			targetDiv.style.gridAutoRows = '60px'; // fixed row height
			targetDiv.style.gap = '0px';
			targetDiv.style.padding = '5px';
			targetDiv.style.color = 'white';
			targetDiv.style.fontSize = '16px';
			targetDiv.style.fontFamily = 'monospace';
			targetDiv.style.overflow = 'hidden';
			targetDiv.style.height = '100vh'; // full screen height

			// securityCode is the claim PIN, shown only while the node is
			// unlinked (see PlaybackController's !wallType fallback and
			// ProvisioningManager's post-provision push) - omitted entirely
			// once a caller stops passing it, e.g. after the node is linked
			// and PlaybackController takes the linked branch instead
			const text = securityCode
				? `${serialNumber}<br>${securityCode}`
				: `${serialNumber}`;

			// generate grid cells
			const totalBlocks = 170;
			let gridHtml = '';

			for (let i = 0; i < totalBlocks; i++) {
				gridHtml += `
					<div style="
						background: none;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						text-align: center;
						width: 180px;
						height: 60px;
					">
						${text}
					</div>
				`;
			}

			// inject grid into target
			targetDiv.innerHTML = gridHtml;
		}

		function hideSerialNumberScreen() {
			const targetDiv = document.getElementById('serialNumberScreen');

			targetDiv.style.display = 'none';
		}



		// COMMISSIONING SCREEN - first boot, on the bench at the J2 facility.
		//
		// THE WORDS LIVE HERE, not on the server. The sync response carries a
		// state, a step and a version; this function decides what a person
		// standing in front of the wall actually reads. Two reasons, both
		// deliberate: a customer-visible surface takes no free text from an API,
		// and wording that lives in this file is versioned with the firmware
		// that draws it.
		//
		// Tiled 170 times for the same reason the serial screen is - a wall is
		// many panels and a person is usually standing in front of one of them,
		// so the message has to be readable wherever they happen to be looking.
		function showCommissioningScreen(state, step, version) {
			const targetDiv = document.getElementById('commissioningScreen');

			let line1, line2, line3;
			let background = 'black';

			if (state === 'stuck') {
				// John's ruling, 2026-09-25: an explicit NOT COMPLETE screen
				// rather than a quiet fallback to the serial number. A unit
				// showing this is NOT on the release it is supposed to ship
				// with, and the whole purpose of the screen is to stop somebody
				// printing a label for it anyway. Red, because the identify
				// screens already teach that red means "not this one".
				background = '#7f0000';
				line1 = 'NOT COMPLETE';
				line2 = 'DO NOT SHIP';
				line3 = 'SEE FLAIR';
			} else if (step === 'installing') {
				line1 = 'INSTALLING';
				line2 = version ? version : 'UPDATE';
				line3 = 'DO NOT CYCLE POWER';
			} else {
				// 'checking' - and anything unrecognised. An unknown step still
				// means the server considers this node uncommissioned, so the
				// safe screen is the one that says do not pull the plug.
				line1 = 'INSTALLING';
				line2 = 'PLEASE WAIT';
				line3 = 'DO NOT CYCLE POWER';
			}

			targetDiv.style.backgroundColor = background;
			targetDiv.style.display = 'grid';
			targetDiv.style.gridTemplateColumns = 'repeat(auto-fill, minmax(180px, 1fr))';
			targetDiv.style.gridAutoRows = '60px'; // fixed row height
			targetDiv.style.gap = '0px';
			targetDiv.style.padding = '5px';
			targetDiv.style.color = 'white';
			targetDiv.style.fontSize = '16px';
			targetDiv.style.fontFamily = 'monospace';
			targetDiv.style.overflow = 'hidden';
			targetDiv.style.height = '100vh'; // full screen height

			const text = `${line1}<br>${line2}<br>${line3}`;

			// generate grid cells
			const totalBlocks = 170;
			let gridHtml = '';

			for (let i = 0; i < totalBlocks; i++) {
				gridHtml += `
					<div style="
						background: none;
						display: flex;
						flex-direction: column;
						align-items: center;
						justify-content: center;
						text-align: center;
						width: 180px;
						height: 60px;
					">
						${text}
					</div>
				`;
			}

			// inject grid into target
			targetDiv.innerHTML = gridHtml;
		}

		function hideCommissioningScreen() {
			const targetDiv = document.getElementById('commissioningScreen');

			targetDiv.style.display = 'none';
		}







		function showWallTypeZonesLayout(data) {
			const container = document.getElementById('wallTypeZonesLayout');

			// Clear existing content
			container.style.display = 'block';
			container.innerHTML = '';

			// Loop through each zone
			data.zones.forEach(zone => {
				const zoneDiv = document.createElement('div');
				zoneDiv.style.position = 'absolute';
				zoneDiv.style.left = `${zone.x}px`;
				zoneDiv.style.top = `${zone.y}px`;
				zoneDiv.style.width = `${zone.width}px`;
				zoneDiv.style.height = `${zone.height}px`;
				zoneDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
				zoneDiv.style.border = '1px solid rgba(255, 255, 255, 0.3)';
				zoneDiv.style.color = 'white';
				zoneDiv.style.padding = '2px';
				zoneDiv.style.fontSize = '14px';
				zoneDiv.style.fontWeight = '500';
				zoneDiv.style.boxSizing = 'border-box';

				const innerDiv = document.createElement('div');
				innerDiv.style.width = '100%';
				innerDiv.style.height = '100%';
				innerDiv.style.display = 'flex';
				innerDiv.style.flexDirection = 'column';
				innerDiv.style.justifyContent = 'center';
				innerDiv.style.alignItems = 'center';
				innerDiv.style.textAlign = 'center';
				innerDiv.style.lineHeight = '1.2';
				innerDiv.style.padding = '0px';
				innerDiv.style.wordBreak = 'break-word';

				// Calculate responsive font size
				const fontSize = Math.min(Math.min(zone.width, zone.height) * 0.15, 30);
				innerDiv.style.fontSize = `${fontSize}px`;

				// Set inner text
				innerDiv.innerHTML = `
					<div>${zone.name}</div>
					<div>(${zone.x}, ${zone.y})</div>
					<div>${zone.width}x${zone.height}px</div>
				`;

				// Append inner to outer
				zoneDiv.appendChild(innerDiv);
				container.appendChild(zoneDiv);
			});
		}

		function hideWallTypesLayout() {
			const container = document.getElementById('wallTypeZonesLayout');
			container.style.display = 'none';
		}





		function showWallTypeZonesLayoutWithTime(data) {
			const container = document.getElementById('wallTypeZonesLayout');

			// Clear existing content
			container.style.display = 'block';
			container.innerHTML = '';

			// Loop through each zone
			data.zones.forEach(zone => {
				const zoneDiv = document.createElement('div');
				zoneDiv.style.position = 'absolute';
				zoneDiv.style.left = `${zone.x}px`;
				zoneDiv.style.top = `${zone.y}px`;
				zoneDiv.style.width = `${zone.width}px`;
				zoneDiv.style.height = `${zone.height}px`;
				zoneDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.2)';
				zoneDiv.style.border = '1px solid rgba(255, 255, 255, 0.3)';
				zoneDiv.style.color = 'white';
				zoneDiv.style.padding = '2px';
				zoneDiv.style.fontSize = '14px';
				zoneDiv.style.fontWeight = '500';
				zoneDiv.style.boxSizing = 'border-box';

				const innerDiv = document.createElement('div');
				innerDiv.style.width = '100%';
				innerDiv.style.height = '100%';
				innerDiv.style.display = 'flex';
				innerDiv.style.flexDirection = 'column';
				innerDiv.style.justifyContent = 'center';
				innerDiv.style.alignItems = 'center';
				innerDiv.style.textAlign = 'center';
				innerDiv.style.lineHeight = '1.2';
				innerDiv.style.padding = '0px';
				innerDiv.style.wordBreak = 'break-word';

				// Calculate responsive font size
				const fontSize = Math.min(Math.min(zone.width, zone.height) * 0.15, 30);
				innerDiv.style.fontSize = `${fontSize}px`;

				// Set inner text
				innerDiv.innerHTML = `
					<div>${zone.name}</div>
					<div>(${zone.x}, ${zone.y})</div>
					<div>${zone.width}x${zone.height}px</div>
					<div>NodeJS Uptime: ${zone.uptime}</div>
					<div>Current Time: ${zone.time_of_day}</div>
				`;

				// Append inner to outer
				zoneDiv.appendChild(innerDiv);
				container.appendChild(zoneDiv);
			});
		}









		// ==== RENDER VIDEO FILES ======
		function hideAllRenderedVideoFiles() {
			const container = document.getElementById('renderedVideosLayout');
			container.innerHTML = '';
		}


		function renderVideoFile(data) {
			const layout = document.getElementById('renderedVideosLayout');

			// Construct full file path by replacing "render.html" in current location
			const basePath = window.location.href.replace(/render\.html$/, '');
			const fullPath = basePath + data.file.replace(/^\//, '');

			console.log('rendering at ' + fullPath)

			let element;

			if (data.type === 'video') {
				element = document.createElement('video');
				element.src = fullPath;
				element.autoplay = true;
				element.muted = true;
				element.playsInline = true;

				// Suppress Chromium's remote-playback ("cast") indicator, which
				// appears over the wall whenever a video starts - most visibly
				// when a trigger fires. Set as a property AND an attribute:
				// the property is what Chromium reads, the attribute keeps it
				// visible in the DOM for anyone inspecting a live node.
				//
				// Deliberately not a browser flag. The kiosk script already
				// passes --disable-features=PointerLock and the OS injects its
				// own flags ahead of ours; multiple --disable-features flags do
				// NOT merge, the last one wins, so adding MediaRouter there
				// would silently drop PointerLock. A per-element attribute
				// cannot be clobbered by OS-level Chromium config.
				element.disableRemotePlayback = true;
				element.setAttribute('disableremoteplayback', '');

				// Render health: count this video's presented frames.
				watchVideoFrames(element);

				const shouldLoop = data.loop !== false;
				element.loop = shouldLoop;

				if (!shouldLoop) {
					element.addEventListener('ended', () => {
						element.remove();
					});
				}

			} else if (data.type === 'image') {
				element = document.createElement('img');
				element.src = fullPath;
			} else {
				console.warn('Unknown type:', data.type);
				return;
			}

			element.id = data.dom_id;
			element.dataset.mountedAt = String(Date.now());
			element.style.position = 'absolute';
			element.style.left = data.x + 'px';
			element.style.top = data.y + 'px';
			element.style.width = data.width + 'px';
			element.style.height = data.height + 'px';
			element.style.objectFit = 'cover';
			const logicalZ = (typeof data.z_index === 'number') ? data.z_index : 17;
			element.style.zIndex = 100 - logicalZ;

			layout.appendChild(element);
		}

		// Grace period for a freshly mounted <video> to reach readyState 2.
		// Before 2026-09-04 a clip still loading on the tick after it was
		// mounted was "invalid", torn down, and mounted again on the next
		// tick — a 1 s gap on slow media, and a permanent 1 Hz create/
		// destroy loop on an unplayable file.
		const VIDEO_LOAD_GRACE_MS = 15000;
		// How often an element that has ERRORED is torn down and retried.
		const VIDEO_ERROR_RETRY_MS = 30000;

		function assertVideoIsPlaying(data) {
			const existing = document.getElementById(data.dom_id);

			if (existing) {
				// Handle VIDEO check
				if (existing.tagName === 'VIDEO') {
					const ageMs = Date.now() - Number(existing.dataset.mountedAt || 0);

					if (existing.error) {
						// A real decode/network error (a 404, an unplayable file). Retry
						// by replacing it — but only every VIDEO_ERROR_RETRY_MS, not on
						// every 1 s assert, or an unplayable file is a permanent 1 Hz
						// create/destroy loop (2026-09-04 second pass on review M21).
						if (ageMs < VIDEO_ERROR_RETRY_MS) {
							return;
						}
					} else if (existing.readyState < 2 && ageMs < VIDEO_LOAD_GRACE_MS) {
						return; // Still loading — leave it alone.
					} else if (existing.readyState >= 2 && existing.paused && !existing.ended) {
						// Loaded but paused (autoplay refused, or a page stall):
						// nudge it rather than rebuild it.
						existing.play().catch(function () {});
						return;
					} else if (existing.readyState >= 2 && !existing.paused && !existing.ended) {
						return; // Healthy.
					}
				}

				// Handle IMAGE check
				else if (existing.tagName === 'IMG') {
					const isValid =
						existing.complete &&
						existing.naturalWidth > 0 &&
						existing.naturalHeight > 0;

					if (isValid) {
						return; // No action needed
					}
				}

				// Element is invalid: remove it and re-render below. (The old
				// code removed it and then tested `if (!existing)` — a removed
				// node is still a truthy reference, so the re-render never
				// ran in the same call. Review M21, 2026-09-04.)
				existing.remove();
			}

			renderVideoFile(data);
		}

		function clearVideosExceptDomIds(data) {
			try {
				const domIdsToKeep = Array.isArray(data?.dom_ids) ? data.dom_ids.map(String) : [];

				// Only the rendered-video layer is ours to clear. Selecting every
				// <video>/<img> on the page removed #offline-indicator and the
				// boot/error screens on the first rotation after boot, so
				// show_offline_indicator later toggled a detached node and the
				// one on-glass sign of a lost cloud never appeared (2026-09-04
				// second pass; pre-existing, reached every second once the
				// rotation keep-list was fixed).
				const layout = document.getElementById('renderedVideosLayout');
				const all = layout ? layout.querySelectorAll('video, img') : [];
				all.forEach((el) => {
					if (!domIdsToKeep.includes(el.id)) {
						el.remove();
					}
				});
			} catch (err) {
				console.error('clearVideosExceptDomIds failed:', err);
			}
		}


		function clearVideoById(data) {
			try {
				const el = document.getElementById(data?.dom_id);
				if (el) el.remove();
			} catch (err) {
				console.error('clearVideoById failed:', err);
			}
		}
















		// === Offline Indicator ===
		function showOfflineIndicator() {
			offlineIndicator.style.display = 'block';
		}

		function hideOfflineIndicator() {
			offlineIndicator.style.display = 'none';
		}


		// === Fallback/Error Handling ===
		function showBootScreen() {
			console.log('Showing Flair boot screen...');
			bootScreen.style.display = 'flex';
		}

		function hideBootScreen() {
			bootScreen.style.display = 'none';
		}

		function showErrorScreen() {
			errorScreen.style.display = 'flex';
		}

		function hideErrorScreen() {
			errorScreen.style.display = 'none';
		}
	</script>
